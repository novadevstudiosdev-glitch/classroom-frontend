<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anagrama</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root{
      --space:#06080f;
      --card:#0d1117;
      --card2:#111827;
      --purple:#7c3aed;
      --cyan:#06b6d4;
      --border:rgba(255,255,255,.08);
      --muted:rgba(255,255,255,.45);
      --radius:16px;
    }

    body{
      font-family:'Nunito',system-ui,sans-serif;
      background:var(--space);
      color:#fff;
      min-height:100vh;
      display:flex;flex-direction:column;
      overflow:hidden;
    }

    /* Stars */
    #stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite;animation-delay:var(--delay,0s)}
    @keyframes twinkle{0%,100%{opacity:.08}50%{opacity:.55}}

    /* Header */
    .header{
      position:relative;z-index:10;
      background:rgba(13,17,23,.85);
      border-bottom:1px solid var(--border);
      backdrop-filter:blur(12px);
      padding:10px 20px;
      display:flex;align-items:center;gap:12px;
      flex-shrink:0;
    }
    .back-btn{
      background:rgba(255,255,255,.06);
      border:1px solid var(--border);
      color:rgba(255,255,255,.8);
      font-family:inherit;font-size:14px;font-weight:700;
      padding:7px 16px;border-radius:999px;cursor:pointer;
      transition:background .15s;white-space:nowrap;
    }
    .back-btn:hover{background:rgba(255,255,255,.12)}
    .hdr-title{font-size:18px;font-weight:900;color:#fff;flex:1;text-align:center}
    .hdr-pill{
      font-weight:800;font-size:14px;
      padding:7px 16px;border-radius:999px;white-space:nowrap;border:1px solid;
    }
    .pill-gold {background:rgba(249,200,79,.12);border-color:rgba(249,200,79,.3);color:#f9c84f}
    .pill-cyan {background:rgba(6,182,212,.12);border-color:rgba(6,182,212,.3);color:var(--cyan)}

    /* Body */
    .body{
      position:relative;z-index:10;
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:20px;gap:20px;overflow:hidden;
    }

    /* Progress */
    .progress-row{
      display:flex;align-items:center;gap:14px;
      width:100%;max-width:540px;
    }
    .progress-track{
      flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;
    }
    .progress-fill{
      height:100%;background:var(--cyan);border-radius:999px;transition:width .5s ease;
    }
    .progress-label{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}

    /* Hint card */
    .hint-card{
      background:var(--card);
      border:1px solid var(--border);
      border-left:4px solid var(--purple);
      border-radius:var(--radius);
      padding:20px 28px;text-align:center;
      width:100%;max-width:540px;
    }
    .hint-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
    .hint-text{font-size:18px;font-weight:700;color:#fff}

    /* Answer slots */
    .answer-area{
      display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
      min-height:70px;align-items:center;
    }
    .slot{
      width:56px;height:60px;
      border:2px dashed rgba(255,255,255,.2);
      border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      font-size:26px;font-weight:900;color:#fff;
      background:rgba(255,255,255,.04);
      transition:all .2s;cursor:default;
    }
    .slot.filled{
      border-style:solid;border-color:rgba(255,255,255,.15);
      background:rgba(255,255,255,.08);
      cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);
    }
    .slot.filled:hover{transform:translateY(-3px)}
    .slot.correct-slot{border-color:#10b981;background:rgba(16,185,129,.15)}
    .slot.wrong-slot{border-color:#ef4444;background:rgba(239,68,68,.15);animation:shake .4s ease}

    @keyframes shake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-8px)}
      40%{transform:translateX(8px)}
      60%{transform:translateX(-6px)}
      80%{transform:translateX(6px)}
    }

    /* Letter tiles */
    .tiles-area{
      display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
      min-height:70px;align-items:center;
    }
    .tile{
      width:56px;height:60px;
      border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      font-size:26px;font-weight:900;color:#fff;
      cursor:pointer;
      box-shadow:0 5px 0 rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.2);
      transition:transform .1s,box-shadow .1s,opacity .2s;
      position:relative;overflow:hidden;user-select:none;
    }
    .tile::before{
      content:'';position:absolute;
      top:0;left:0;right:0;height:45%;
      background:rgba(255,255,255,.2);
      border-radius:14px 14px 50% 50%;
      pointer-events:none;
    }
    .tile:hover:not(.used){transform:translateY(-4px);box-shadow:0 9px 0 rgba(0,0,0,.4)}
    .tile:active:not(.used){transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
    .tile.used{opacity:0;pointer-events:none;transform:translateY(-10px)}

    /* Feedback banner */
    .feedback{
      position:fixed;bottom:-80px;left:50%;transform:translateX(-50%);
      padding:14px 44px;border-radius:999px;
      font-size:18px;font-weight:800;color:#fff;
      box-shadow:0 6px 30px rgba(0,0,0,.4);
      transition:bottom .35s cubic-bezier(.34,1.56,.64,1);
      z-index:100;white-space:nowrap;
    }
    .feedback.show{bottom:24px}
    .fb-correct{background:#10b981}
    .fb-wrong{background:#ef4444}
    .fb-skip{background:#8b5cf6}

    /* Win overlay */
    .win-overlay{
      display:none;position:fixed;inset:0;
      background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
      z-index:500;align-items:center;justify-content:center;
    }
    .win-overlay.show{display:flex}
    .win-card{
      background:var(--card2);
      border:1px solid rgba(124,58,237,.4);
      border-radius:28px;padding:40px 48px;
      text-align:center;max-width:400px;width:90%;
      box-shadow:0 0 60px rgba(124,58,237,.2),0 20px 60px rgba(0,0,0,.4);
      animation:winPop .5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes winPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
    .win-emoji{font-size:72px;display:block;margin-bottom:16px;animation:float 2s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .win-title{font-size:32px;font-weight:900;color:#fff;margin-bottom:8px}
    .win-sub{font-size:16px;color:var(--muted);margin-bottom:24px}
    .win-stats{display:flex;gap:12px;margin-bottom:28px}
    .win-stat{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px;padding:14px}
    .win-stat-num{font-size:28px;font-weight:900;color:var(--cyan)}
    .win-stat-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:2px}
    .win-btns{display:flex;gap:10px}
    .btn-retry{
      flex:1;padding:14px;border:1px solid var(--border);border-radius:var(--radius);
      font-family:inherit;font-size:15px;font-weight:800;
      background:rgba(255,255,255,.06);color:#fff;cursor:pointer;transition:background .15s;
    }
    .btn-home{
      flex:1;padding:14px;border:none;border-radius:var(--radius);
      font-family:inherit;font-size:15px;font-weight:800;
      background:var(--cyan);color:#000;cursor:pointer;
      box-shadow:0 0 20px rgba(6,182,212,.4);transition:transform .1s;
    }
    .btn-retry:hover{background:rgba(255,255,255,.12)}
    .btn-home:hover{transform:translateY(-2px)}
    .btn-home:active{transform:translateY(2px)}

    /* Confetti */
    .confetti-piece{
      position:fixed;top:-20px;border-radius:2px;
      pointer-events:none;z-index:600;
      animation:confettiFall linear forwards;
    }
    @keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

    /* Skip button */
    .skip-btn{
      background:transparent;border:1px solid var(--border);
      color:var(--muted);font-family:inherit;font-size:14px;font-weight:700;
      padding:8px 20px;border-radius:999px;cursor:pointer;
      transition:all .15s;
    }
    .skip-btn:hover{background:rgba(139,92,246,.15);border-color:rgba(139,92,246,.5);color:#a78bfa}
  </style>
</head>
<body>

<!-- Stars -->
<div id="stars"></div>

<div class="header">
  <button class="back-btn" onclick="location.href='index.html'">← Volver</button>
  <span class="hdr-title">🔀 Anagrama</span>
  <span class="hdr-pill pill-gold" id="hdr-timer">⏱ 00:00</span>
  <span class="hdr-pill pill-cyan" id="hdr-score">★ 0</span>
</div>

<div class="body">
  <div class="progress-row">
    <span class="progress-label" id="prog-label">1 / 8</span>
    <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>

  <div class="hint-card">
    <div class="hint-label">💡 Pista</div>
    <div class="hint-text" id="hint-text">...</div>
  </div>

  <div class="answer-area" id="answer-area"></div>

  <div class="tiles-area" id="tiles-area"></div>

  <button class="skip-btn" id="skip-btn">Saltar esta palabra →</button>
</div>

<div class="feedback" id="feedback"></div>

<div class="win-overlay" id="win-overlay">
  <div class="win-card">
    <span class="win-emoji">🏆</span>
    <div class="win-title">¡Completaste todas!</div>
    <div class="win-sub" id="win-sub">¡Excelente trabajo!</div>
    <div class="win-stats">
      <div class="win-stat"><div class="win-stat-num" id="win-score">0</div><div class="win-stat-label">Puntos</div></div>
      <div class="win-stat"><div class="win-stat-num" id="win-time">0s</div><div class="win-stat-label">Tiempo</div></div>
      <div class="win-stat"><div class="win-stat-num" id="win-words">0</div><div class="win-stat-label">Palabras</div></div>
    </div>
    <div class="win-btns">
      <button class="btn-retry" id="btn-retry">🔄 Jugar de nuevo</button>
      <button class="btn-home" onclick="location.href='index.html'">🏠 Menú</button>
    </div>
  </div>
</div>

<script>
// ── Stars ─────────────────────────────────────────────────────
(function(){
  const container = document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s = document.createElement('div');
    s.className='star';
    const sz = Math.random()*2+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;opacity:${Math.random()*.4+.05};--d:${(Math.random()*3+2).toFixed(1)}s;--delay:${(Math.random()*4).toFixed(1)}s`;
    container.appendChild(s);
  }
})();

// ── Word list ─────────────────────────────────────────────────
const WORDS = [
  { word:'GATO',     hint:'Un animal doméstico que maúlla 🐱' },
  { word:'PERRO',    hint:'El mejor amigo del hombre 🐶' },
  { word:'TIGRE',    hint:'Felino salvaje con rayas 🐯' },
  { word:'PATO',     hint:'Ave acuática que hace "cuac" 🦆' },
  { word:'LEON',     hint:'El rey de la selva 🦁' },
  { word:'AGUILA',   hint:'Ave rapaz que vuela muy alto 🦅' },
  { word:'CONEJO',   hint:'Animal con orejas largas 🐰' },
  { word:'DELFIN',   hint:'Mamífero marino muy inteligente 🐬' },
];

const TILE_COLORS = ['#e74c5e','#3b82f6','#f59e0b','#10b981','#8b5cf6','#06b6d4','#f97316','#ec4899'];

// ── State ─────────────────────────────────────────────────────
let wordIdx = 0, score = 0, timerSecs = 0, timerInterval = null;
let currentWord = '', tiles = [], answerSlots = [];
let wrongAttempts = 0, wordQueue = [];

// ── Init ──────────────────────────────────────────────────────
function init() {
  score = 0; timerSecs = 0; wordIdx = 0; wrongAttempts = 0;
  wordQueue = shuffle([...WORDS]);
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerSecs++;
    const m = String(Math.floor(timerSecs/60)).padStart(2,'0');
    const s = String(timerSecs%60).padStart(2,'0');
    document.getElementById('hdr-timer').textContent = `⏱ ${m}:${s}`;
  }, 1000);
  document.getElementById('win-overlay').classList.remove('show');
  loadWord();
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function scramble(word) {
  let arr = word.split(''), attempts = 0;
  do {
    arr.sort(() => Math.random() - 0.5);
    attempts++;
  } while (arr.join('') === word && attempts < 20);
  return arr;
}

// ── Load word ─────────────────────────────────────────────────
function loadWord() {
  const total = wordQueue.length;
  const entry = wordQueue[wordIdx];
  currentWord = entry.word;
  tiles = scramble(currentWord);
  answerSlots = Array(currentWord.length).fill(null);
  wrongAttempts = 0;

  document.getElementById('hint-text').textContent  = entry.hint;
  document.getElementById('prog-label').textContent = `${wordIdx+1} / ${total}`;
  document.getElementById('prog-fill').style.width  = `${(wordIdx/total)*100}%`;

  renderAnswer();
  renderTiles();
}

// ── Render ────────────────────────────────────────────────────
function renderAnswer() {
  const area = document.getElementById('answer-area');
  area.innerHTML = '';
  for (let i = 0; i < currentWord.length; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot' + (answerSlots[i] ? ' filled' : '');
    slot.dataset.idx = i;
    if (answerSlots[i]) {
      slot.textContent   = answerSlots[i].letter;
      slot.style.color   = answerSlots[i].color;
      slot.style.borderColor = answerSlots[i].color + '66';
      slot.onclick = () => removeFromSlot(i);
    }
    area.appendChild(slot);
  }
}

function renderTiles() {
  const area = document.getElementById('tiles-area');
  area.innerHTML = '';
  tiles.forEach((letter, i) => {
    const tile = document.createElement('div');
    tile.className   = 'tile';
    tile.textContent = letter;
    tile.style.background = TILE_COLORS[i % TILE_COLORS.length];
    tile.style.boxShadow  = `0 5px 0 ${darken(TILE_COLORS[i % TILE_COLORS.length])}, 0 6px 20px rgba(0,0,0,.3)`;
    tile.dataset.tileIdx  = i;
    tile.onclick = () => placeInSlot(i, letter, TILE_COLORS[i % TILE_COLORS.length]);
    area.appendChild(tile);
  });
}

function darken(hex) {
  const n = parseInt(hex.slice(1),16);
  const r = Math.max(0,((n>>16)&0xff)-40);
  const g = Math.max(0,((n>>8)&0xff)-40);
  const b = Math.max(0,(n&0xff)-40);
  return `#${((r<<16)|(g<<8)|b).toString(16).padStart(6,'0')}`;
}

// ── Interaction ───────────────────────────────────────────────
function placeInSlot(tileIdx, letter, color) {
  const emptyIdx = answerSlots.findIndex(s => s === null);
  if (emptyIdx === -1) return;

  answerSlots[emptyIdx] = { letter, color, tileIdx };

  const tileEl = document.querySelector(`.tile[data-tile-idx="${tileIdx}"]`);
  if (tileEl) tileEl.classList.add('used');

  renderAnswer();

  if (answerSlots.every(s => s !== null)) {
    setTimeout(checkAnswer, 200);
  }
}

function removeFromSlot(slotIdx) {
  const entry = answerSlots[slotIdx];
  if (!entry) return;
  answerSlots[slotIdx] = null;

  const tileEl = document.querySelector(`.tile[data-tile-idx="${entry.tileIdx}"]`);
  if (tileEl) tileEl.classList.remove('used');

  renderAnswer();
}

function checkAnswer() {
  const answer = answerSlots.map(s => s?.letter).join('');
  const slots  = document.querySelectorAll('.slot.filled');

  if (answer === currentWord) {
    slots.forEach(s => { s.classList.add('correct-slot'); });
    const bonus = wrongAttempts === 0 ? 50 : 0;
    score += 100 + bonus;
    document.getElementById('hdr-score').textContent = `★ ${score}`;
    showFeedback(wrongAttempts === 0 ? '✅  ¡Correcto! +50 bonus 🎉' : '✅  ¡Correcto!', 'fb-correct');
    setTimeout(nextWord, 1400);
  } else {
    wrongAttempts++;
    slots.forEach(s => { s.classList.add('wrong-slot'); });
    showFeedback('❌  ¡Casi! Intentá de nuevo', 'fb-wrong');
    setTimeout(() => {
      answerSlots = Array(currentWord.length).fill(null);
      document.querySelectorAll('.tile').forEach(t => t.classList.remove('used'));
      renderAnswer();
    }, 700);
  }
}

function nextWord() {
  wordIdx++;
  if (wordIdx >= wordQueue.length) finishGame();
  else loadWord();
}

function showFeedback(msg, cls) {
  const fb = document.getElementById('feedback');
  fb.textContent = msg;
  fb.className   = `feedback ${cls} show`;
  setTimeout(() => fb.classList.remove('show'), 1300);
}

// ── Skip ──────────────────────────────────────────────────────
document.getElementById('skip-btn').onclick = () => {
  answerSlots = currentWord.split('').map((letter,i) => ({
    letter, color: '#8b5cf6', tileIdx: i,
  }));
  renderAnswer();
  document.querySelectorAll('.slot.filled').forEach(s => { s.style.borderColor='#8b5cf666'; });
  showFeedback(`💡  Era: ${currentWord}`, 'fb-skip');
  setTimeout(nextWord, 1400);
};

// ── Finish ────────────────────────────────────────────────────
function finishGame() {
  clearInterval(timerInterval);
  const m = String(Math.floor(timerSecs/60)).padStart(2,'0');
  const s = String(timerSecs%60).padStart(2,'0');
  document.getElementById('win-score').textContent = score;
  document.getElementById('win-time').textContent  = `${m}:${s}`;
  document.getElementById('win-words').textContent = wordQueue.length;
  document.getElementById('win-sub').textContent   =
    score >= 700 ? '¡Maestro de los anagramas! 🧠' :
    score >= 400 ? '¡Muy buen trabajo! 🌟' : '¡Seguí practicando! 💪';
  document.getElementById('win-overlay').classList.add('show');
  document.getElementById('btn-retry').onclick = init;
  spawnConfetti();
}

function spawnConfetti() {
  const colors = ['#f9c74f','#06b6d4','#10b981','#e74c5e','#8b5cf6','#f97316'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const sz = 6 + Math.random()*8;
    el.style.cssText = `left:${Math.random()*100}vw;background:${colors[i%colors.length]};width:${sz}px;height:${sz}px;border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1.5+Math.random()*2}s;animation-delay:${i*50}ms`;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

init();
</script>
</body>
</html>
