<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NOVI · Lobby — Salas</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --space:#06080f; --space2:#0d1635;
  --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.10);
  --border:rgba(255,255,255,.10);
  --purple:#7c3aed; --cyan:#06b6d4; --gold:#f59e0b;
  --green:#22c55e; --red:#ef4444; --muted:#64748b; --text:#e2e8f0;
}
html,body{height:100%;font-family:'Nunito',system-ui,sans-serif;background:var(--space);color:var(--text);overflow-x:hidden}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.7}}
.nebula{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.neb1{width:500px;height:500px;background:rgba(124,58,237,.09);top:-100px;left:-100px}
.neb2{width:400px;height:400px;background:rgba(6,182,212,.07);bottom:-80px;right:-60px}

/* ── Navbar ── */
.navbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(6,8,15,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:18px;font-weight:900;color:#fff;letter-spacing:-.5px}
.nav-logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--purple),var(--cyan));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.nav-logo span{color:var(--cyan)}
.nav-back{display:flex;align-items:center;gap:6px;background:var(--glass);border:1.5px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:10px;cursor:pointer;transition:background .15s;text-decoration:none}
.nav-back:hover{background:var(--glass2)}

/* ── Screen base ── */
.screen{display:none;position:relative;z-index:1}
.screen.active{display:block}
#s-enter{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px 24px}
#s-enter.active{display:flex}
#s-rooms{height:100vh;display:none}
#s-rooms.active{display:grid;grid-template-columns:1fr 260px;grid-template-rows:56px 1fr;overflow:hidden}

/* ── Enter screen ── */
.enter-card{background:rgba(13,22,53,.85);border:1.5px solid var(--border);border-radius:20px;backdrop-filter:blur(16px);padding:36px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px;animation:slideUp .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.logo{font-size:30px;font-weight:900;letter-spacing:-1px;text-align:center;margin-bottom:4px}
.logo span{color:var(--cyan)}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.inp{background:var(--glass2);border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;font-family:inherit;font-size:14px;font-weight:700;color:#fff;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--cyan)}
.inp::placeholder{color:var(--muted)}
.btn{padding:13px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--purple),#5b21b6);font-family:inherit;font-size:15px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 4px 0 #3b0f8c;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 #3b0f8c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3b0f8c}
.err{color:#fca5a5;font-size:13px;font-weight:700;display:none;padding:8px;background:rgba(239,68,68,.1);border-radius:8px;text-align:center}

/* ── Rooms layout ── */
.rooms-nav{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(6,8,15,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:10}
.rooms-main{display:flex;flex-direction:column;overflow:hidden;padding:20px;gap:16px}
.rooms-header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.rooms-title{font-size:18px;font-weight:900}
.btn-create{display:flex;align-items:center;gap:8px;padding:9px 18px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--cyan),#0891b2);font-family:inherit;font-size:13px;font-weight:800;color:#fff;cursor:pointer;transition:opacity .15s}
.btn-create:hover{opacity:.85}
.rooms-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.rooms-scroll::-webkit-scrollbar{width:3px}
.rooms-scroll::-webkit-scrollbar-thumb{background:var(--glass2);border-radius:3px}
.room-card{display:flex;align-items:center;justify-content:space-between;background:rgba(13,22,53,.7);border:1.5px solid var(--border);border-radius:14px;padding:14px 18px;transition:border-color .15s,background .15s;gap:12px}
.room-card:hover{border-color:rgba(6,182,212,.4);background:rgba(13,22,53,.9)}
.room-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.room-name{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-meta{font-size:12px;color:var(--muted);font-weight:600}
.room-badge{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.badge-waiting{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.badge-players{background:var(--glass);color:var(--text);border:1px solid var(--border)}
.btn-join{padding:7px 16px;border:none;border-radius:9px;background:var(--cyan);font-family:inherit;font-size:13px;font-weight:800;color:#fff;cursor:pointer;transition:opacity .15s;flex-shrink:0}
.btn-join:hover{opacity:.85}
.rooms-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted)}
.rooms-empty-icon{font-size:48px;opacity:.4}

/* ── Right sidebar ── */
.rooms-sidebar{display:flex;flex-direction:column;background:rgba(13,22,53,.6);border-left:1px solid var(--border);padding:16px;gap:6px;overflow:hidden}
.sb-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:4px}
.online-list{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto;margin-bottom:10px}
.online-chip{display:flex;align-items:center;gap:7px;background:var(--glass);border-radius:7px;padding:5px 9px;font-size:12px;font-weight:700}
.online-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.sb-divider{height:1px;background:var(--border);margin:6px 0}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;min-height:0;margin-bottom:8px}
.chat-msgs::-webkit-scrollbar{width:2px}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--glass2);border-radius:2px}
.chat-msg{font-size:12px;line-height:1.4;padding:4px 6px;border-radius:6px;background:var(--glass);word-break:break-word}
.chat-msg .alias{font-weight:800;color:var(--cyan)}
.chat-input-row{display:flex;gap:6px;flex-shrink:0}
.chat-inp{flex:1;background:var(--glass2);border:1.5px solid var(--border);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:12px;font-weight:700;color:#fff;outline:none}
.chat-inp:focus{border-color:var(--cyan)}
.chat-inp::placeholder{color:var(--muted)}
.chat-send{width:34px;height:34px;border:none;border-radius:9px;background:var(--cyan);color:#fff;font-size:15px;cursor:pointer;flex-shrink:0}

/* ── Create room modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200}
.modal-overlay.show{display:flex}
.modal{background:rgba(13,22,53,.97);border:1.5px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}
.modal-title{font-size:18px;font-weight:900}
.modal-close{position:absolute;top:14px;right:14px;background:var(--glass);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-family:inherit;font-size:12px;font-weight:700;color:var(--text);cursor:pointer}

/* ── Join modal ── */
.join-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200}
.join-modal.show{display:flex}

/* ── Loading ── */
#s-loading{position:fixed;inset:0;background:var(--space);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:300;font-size:16px;font-weight:700;color:var(--muted)}
#s-loading.active{display:flex}
.spin{width:36px;height:36px;border:3px solid var(--glass2);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="stars"></div>
<div class="nebula neb1"></div>
<div class="nebula neb2"></div>

<!-- Loading -->
<div id="s-loading">
  <div class="spin"></div>
  <span id="load-txt">Conectando...</span>
</div>

<!-- ── ENTER SCREEN ─────────────────────────────────────────────────────── -->
<div id="s-enter" class="screen active">
  <div class="enter-card">
    <div class="logo">NO<span>VI</span></div>
    <div style="font-size:18px;font-weight:900;text-align:center">Entrar al Lobby</div>
    <div class="field">
      <label>Tu nombre / alias</label>
      <input class="inp" id="alias-inp" placeholder="Ej: Juanito123" maxlength="24"
        onkeydown="if(event.key==='Enter')enterLobby()"/>
    </div>
    <div class="err" id="enter-err"></div>
    <button class="btn" onclick="enterLobby()">🚀 Entrar al Lobby</button>
    <a href="/minigame/home" class="nav-back" style="justify-content:center">← Volver</a>
  </div>
</div>

<!-- ── ROOMS SCREEN ─────────────────────────────────────────────────────── -->
<div id="s-rooms" class="screen">

  <!-- Navbar -->
  <div class="rooms-nav">
    <div class="nav-logo">
      <div class="nav-logo-icon">🚀</div>
      NO<span style="color:var(--cyan)">VI</span>
    </div>
    <span style="font-size:13px;font-weight:700;color:var(--muted)" id="nav-alias"></span>
    <a href="/minigame/home" class="nav-back">← Salir</a>
  </div>

  <!-- Main content -->
  <div class="rooms-main">
    <div class="rooms-header">
      <div>
        <div class="rooms-title">🎮 Salas disponibles</div>
        <div style="font-size:12px;color:var(--muted);font-weight:600;margin-top:2px" id="rooms-count">Buscando salas...</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="nav-back" onclick="document.getElementById('join-modal').classList.add('show')" style="font-size:13px">🔑 Unirse con código</button>
        <button class="btn-create" onclick="document.getElementById('create-modal').classList.add('show')">
          ＋ Crear sala
        </button>
      </div>
    </div>

    <div class="rooms-scroll" id="rooms-scroll">
      <div class="rooms-empty" id="rooms-empty">
        <div class="rooms-empty-icon">🏠</div>
        <div style="font-weight:700;font-size:15px">No hay salas abiertas</div>
        <div style="font-size:13px">¡Creá la primera!</div>
      </div>
    </div>
  </div>

  <!-- Sidebar: online users + chat -->
  <div class="rooms-sidebar">
    <div class="sb-title">🟢 Online en el lobby (<span id="online-count">0</span>)</div>
    <div class="online-list" id="online-list"></div>
    <div class="sb-divider"></div>
    <div class="sb-title">💬 Chat del lobby</div>
    <div class="chat-msgs" id="chat-msgs"></div>
    <div class="chat-input-row">
      <input class="chat-inp" id="chat-inp" placeholder="Escribí algo..." maxlength="200"
        onkeydown="if(event.key==='Enter')sendChat()"/>
      <button class="chat-send" onclick="sendChat()">➤</button>
    </div>
  </div>

</div>

<!-- ── CREATE ROOM MODAL ─────────────────────────────────────────────────── -->
<div class="modal-overlay" id="create-modal" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="document.getElementById('create-modal').classList.remove('show')">✕</button>
    <div class="modal-title">🏠 Crear sala</div>
    <div class="field">
      <label>Nombre de la sala</label>
      <input class="inp" id="room-name-inp" placeholder="Ej: Clase de historia" maxlength="40"
        onkeydown="if(event.key==='Enter')createRoom()"/>
    </div>
    <div class="err" id="create-err"></div>
    <button class="btn" onclick="createRoom()">Crear sala</button>
  </div>
</div>

<!-- ── JOIN WITH CODE MODAL ──────────────────────────────────────────────── -->
<div class="join-modal" id="join-modal" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="document.getElementById('join-modal').classList.remove('show')">✕</button>
    <div class="modal-title">🔑 Unirse con código</div>
    <div class="field">
      <label>Código de sala</label>
      <input class="inp" id="code-inp" placeholder="Ej: ABC123" maxlength="10" style="text-transform:uppercase"
        onkeydown="if(event.key==='Enter')joinWithCode()"/>
    </div>
    <div class="err" id="join-err"></div>
    <button class="btn" onclick="joinWithCode()">Unirse</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const SOCKET_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? `${window.location.protocol}//${window.location.hostname}:3000`
  : (typeof NOVI_CONFIG !== 'undefined' ? NOVI_CONFIG.API_URL.replace('/api','') : 'https://classroom-backend.up.railway.app');

let socket = null;
let myAlias = '';

function $(id){ return document.getElementById(id); }

// ── Stars ───────────────────────────────────────────────────────────────────
(function(){
  const c = $('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=(Math.random()*2+.5)+'px';
    s.style.cssText=`width:${sz};height:${sz};top:${Math.random()*100}%;left:${Math.random()*100}%;opacity:${Math.random()*.6+.1};animation-duration:${Math.random()*3+2}s;animation-delay:${Math.random()*3}s`;
    c.appendChild(s);
  }
})();

// ── Enter lobby ─────────────────────────────────────────────────────────────
function enterLobby(){
  const alias = $('alias-inp').value.trim();
  if(!alias){ showErr('enter-err','Ingresá un nombre.'); return; }
  myAlias = alias;
  showLoading('Conectando...');
  connectSocket();
}

function connectSocket(){
  socket = io(SOCKET_URL+'/game',{transports:['websocket'],reconnection:false});

  socket.on('connect',()=>{
    socket.emit('join-lobby',{alias:myAlias});
    showScreen('s-rooms');
    $('nav-alias').textContent = myAlias;
    hideLoading();
  });

  socket.on('connect_error',()=>{
    hideLoading();
    showErr('enter-err','No se pudo conectar al servidor.');
    showScreen('s-enter');
  });

  socket.on('error',d=>{
    hideLoading();
    showErr('create-err', d.message||'Error');
    showErr('join-err', d.message||'Error');
  });

  socket.on('rooms-list',({rooms})=> renderRooms(rooms));
  socket.on('lobby-update',({users})=> renderOnline(users));
  socket.on('lobby-chat',({alias,text})=> addChat(alias,text));

  socket.on('room-created',({roomCode})=>{
    hideLoading();
    goToLobby(roomCode, myAlias, true);
  });

  socket.on('joined',({roomCode})=>{
    hideLoading();
    goToLobby(roomCode, myAlias, false);
  });
}

// ── Rooms list ───────────────────────────────────────────────────────────────
function renderRooms(rooms){
  const scroll = $('rooms-scroll');
  const empty = $('rooms-empty');
  $('rooms-count').textContent = rooms.length
    ? `${rooms.length} sala${rooms.length!==1?'s':''} abierta${rooms.length!==1?'s':''}`
    : 'No hay salas abiertas';

  // Remove existing cards
  scroll.querySelectorAll('.room-card').forEach(el=>el.remove());

  if(rooms.length === 0){
    empty.style.display='flex';
    return;
  }
  empty.style.display='none';

  rooms.forEach(r=>{
    const card=document.createElement('div');
    card.className='room-card';
    card.innerHTML=`
      <div class="room-info">
        <div class="room-name">${esc(r.roomName)}</div>
        <div class="room-meta">Host: ${esc(r.hostAlias)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <div class="room-badge badge-players">👥 ${r.playerCount}</div>
        <div class="room-badge badge-waiting">Abierta</div>
        <button class="btn-join" onclick="joinRoom('${r.roomCode}')">Unirse</button>
      </div>
    `;
    scroll.appendChild(card);
  });
}

// ── Create room ──────────────────────────────────────────────────────────────
function createRoom(){
  const roomName = $('room-name-inp').value.trim();
  if(!roomName){ showErr('create-err','Escribí un nombre para la sala.'); return; }
  $('create-err').style.display='none';
  $('create-modal').classList.remove('show');
  showLoading('Creando sala...');
  socket.emit('create-room',{alias:myAlias, roomName});
}

// ── Join room ────────────────────────────────────────────────────────────────
function joinRoom(roomCode){
  showLoading('Uniéndose...');
  socket.emit('join-room',{roomCode, alias:myAlias});
}

function joinWithCode(){
  const code = $('code-inp').value.trim().toUpperCase();
  if(!code){ showErr('join-err','Ingresá el código.'); return; }
  $('join-err').style.display='none';
  $('join-modal').classList.remove('show');
  showLoading('Uniéndose...');
  socket.emit('join-room',{roomCode:code, alias:myAlias});
}

// ── Redirect to lobby.html ───────────────────────────────────────────────────
function goToLobby(roomCode, alias, isHost){
  // Store in session so lobby.html can auto-join
  sessionStorage.setItem('novi_room',roomCode);
  sessionStorage.setItem('novi_alias',alias);
  sessionStorage.setItem('novi_isHost',isHost?'1':'0');
  window.location.href = '/minigame/lobby.html';
}

// ── Online users ─────────────────────────────────────────────────────────────
function renderOnline(users){
  const list = $('online-list');
  $('online-count').textContent = users.length;
  list.innerHTML = users.map(u=>`
    <div class="online-chip">
      <div class="online-dot"></div>
      <span>${esc(u.alias)}</span>
    </div>
  `).join('');
}

// ── Chat ─────────────────────────────────────────────────────────────────────
function sendChat(){
  const inp = $('chat-inp');
  const text = inp.value.trim();
  if(!text||!socket) return;
  socket.emit('lobby-chat',{text});
  inp.value='';
}

function addChat(alias,text){
  const msgs = $('chat-msgs');
  const div = document.createElement('div');
  div.className='chat-msg';
  div.innerHTML=`<span class="alias">${esc(alias)}:</span> ${esc(text)}`;
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
  // Keep max 100 messages
  while(msgs.children.length>100) msgs.removeChild(msgs.firstChild);
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active');
  });
  $(id).classList.add('active');
}

function showLoading(txt){
  $('load-txt').textContent=txt;
  $('s-loading').classList.add('active');
}
function hideLoading(){ $('s-loading').classList.remove('active'); }

function showErr(id,msg){
  const el=$(id);
  el.textContent=msg;
  el.style.display='block';
  setTimeout(()=>el.style.display='none',4000);
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
